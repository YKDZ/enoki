[package]
name = "enoki-probe"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
deterministic-test-seams = ["enoki-probe-bootstrap/deterministic-test-seams"]

[dependencies]
enoki-probe-bootstrap = { path = "../probe-bootstrap", features = [
  "acquirer",
  "activator",
] }
flate2 = "1.0"
libc = "0.2"
prost = "0.14.1"
rsa = { version = "0.9", features = ["pem"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.11", features = ["oid"] }
tar = "0.4"
tempfile = "3.20.0"
toml = "1.1"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
url = "2.5"

[dev-dependencies]
enoki-probe-bootstrap = { path = "../probe-bootstrap", features = [
  "deterministic-test-seams",
] }
object = { version = "0.40.0", default-features = false, features = [
  "elf",
  "read_core",
  "std",
] }
syn = { version = "3", default-features = false, features = [
  "full",
  "parsing",
] }

[lints]
workspace = true
