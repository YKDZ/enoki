[package]
name = "enoki-probe-bootstrap"
version.workspace = true
edition.workspace = true
license.workspace = true
autobins = false

[[bin]]
name = "enoki-probe-bootstrap-acquire"
path = "src/bin/acquire.rs"
required-features = ["acquirer"]

[[bin]]
name = "enoki-probe-bootstrap-activate"
path = "src/bin/activate.rs"
required-features = ["activator"]

[features]
default = []
acquirer = ["dep:flate2", "dep:tar", "dep:ureq", "dep:url"]
activator = []
compiled-trust = []
deterministic-test-seams = []

[dependencies]
flate2 = { version = "1.0", optional = true }
libc = "0.2"
hmac = "0.13"
prost = "0.14.1"
rsa = { version = "0.9", features = ["pem"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.11", features = ["oid"] }
tar = { version = "0.4", optional = true }
ureq = { version = "2.12.1", default-features = false, features = [
  "tls",
], optional = true }
url = { version = "2.5", optional = true }
zeroize = { version = "1.8", features = ["derive"] }

[build-dependencies]
rsa = { version = "0.9", features = ["pem"] }
sha2 = { version = "0.11", features = ["oid"] }

[dev-dependencies]
tempfile = "3.20.0"

[lints]
workspace = true
