name: Build Enoki Release Candidate

on:
  workflow_call:
    secrets:
      probe_asset_signing_key_pem:
        description: Production private key for the signed Probe Asset Set.
        required: true
    inputs:
      commit:
        description: Full source commit for this candidate.
        required: true
        type: string
      version:
        description: Stable candidate SemVer tag, for example v0.1.0.
        required: true
        type: string
    outputs:
      candidate-artifact-name:
        description: Private workflow artifact containing the immutable candidate.
        value: ${{ jobs.assemble-candidate.outputs.artifact-name }}
      verification-artifact-name:
        description: Authoritative evidence for this fresh candidate attempt.
        value: ${{ jobs.finalize-verification.outputs.artifact-name }}
permissions:
  actions: read
  contents: read

jobs:
  validate-candidate-inputs:
    name: Validate candidate source identity
    runs-on: ubuntu-24.04
    outputs:
      trusted-workflow-repository: ${{ steps.trusted-workflow.outputs.repository }}
      trusted-workflow-sha: ${{ steps.trusted-workflow.outputs.sha }}
    steps:
      - name: Reject an untrusted workflow invocation
        id: trusted-workflow
        env:
          CALLER_REF: ${{ github.ref }}
          CALLER_REPOSITORY: ${{ github.repository }}
          JOB_CONTEXT: ${{ toJSON(job) }}
          TRUSTED_WORKFLOW_REF: YKDZ/enoki/.github/workflows/reusable-build-release-candidate.yml@refs/heads/main
        run: |
          workflow_ref="$(jq -r '.workflow_ref // ""' <<<"$JOB_CONTEXT")"
          workflow_repository="$(jq -r '.workflow_repository // ""' <<<"$JOB_CONTEXT")"
          workflow_sha="$(jq -r '.workflow_sha // ""' <<<"$JOB_CONTEXT")"
          if [ "$CALLER_REF" != "refs/heads/main" ] || \
             [ "$CALLER_REPOSITORY" != "YKDZ/enoki" ] || \
             [ "$workflow_ref" != "$TRUSTED_WORKFLOW_REF" ] || \
             [ "$workflow_repository" != "YKDZ/enoki" ] || \
             ! [[ "$workflow_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release Candidate builds must run from the canonical protected main workflow."
            echo "::error::caller: $CALLER_REPOSITORY@$CALLER_REF; workflow: $workflow_ref"
            exit 1
          fi
          echo "repository=$workflow_repository" >> "$GITHUB_OUTPUT"
          echo "sha=$workflow_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact candidate commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: candidate-source
          persist-credentials: false
          ref: ${{ inputs.commit }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: candidate-source/package.json

      - name: Bind candidate source and release policy to one revision
        env:
          CANDIDATE_COMMIT: ${{ inputs.commit }}
          CANDIDATE_VERSION: ${{ inputs.version }}
          TRUSTED_WORKFLOW_SHA: ${{ steps.trusted-workflow.outputs.sha }}
        run: >-
          test "$CANDIDATE_COMMIT" = "$TRUSTED_WORKFLOW_SHA"
          && node candidate-source/scripts/release-candidate.mjs validate-inputs
          --commit "$CANDIDATE_COMMIT"
          --version "$CANDIDATE_VERSION"
          --source-dir candidate-source

  validate-release-configuration:
    name: Validate production release configuration
    needs: validate-candidate-inputs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout immutable release preflight
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: trusted-tool
          persist-credentials: false
          repository: ${{ needs.validate-candidate-inputs.outputs.trusted-workflow-repository }}
          ref: ${{ needs.validate-candidate-inputs.outputs.trusted-workflow-sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: trusted-tool/package.json

      - name: Validate the production Probe signing identity
        env:
          PRODUCTION_PROBE_PRIVATE_KEY: ${{ secrets.probe_asset_signing_key_pem }}
          PRODUCTION_PROBE_PUBLIC_KEY: ${{ vars.ENOKI_PROBE_ASSET_SIGNING_PUBLIC_KEY_PEM }}
          PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY: ${{ vars.ENOKI_PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY_PEM }}
          PROBE_TRUST_DELEGATION: ${{ vars.ENOKI_PROBE_TRUST_DELEGATION_JSON }}
          PROBE_TRUST_DELEGATION_SIGNATURE: ${{ vars.ENOKI_PROBE_TRUST_DELEGATION_SIGNATURE_BASE64 }}
        run: |
          printf '%s' "$PROBE_TRUST_DELEGATION" > trust-delegation.json
          printf '%s' "$PROBE_TRUST_DELEGATION_SIGNATURE" | base64 --decode > trust-delegation.json.sig
          node trusted-tool/scripts/release-candidate.mjs validate-signing-identity \
            --private-key-env PRODUCTION_PROBE_PRIVATE_KEY \
            --public-key-env PRODUCTION_PROBE_PUBLIC_KEY \
            --root-public-key-env PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY \
            --distribution enoki \
            --trust-delegation trust-delegation.json \
            --trust-delegation-signature trust-delegation.json.sig

      - name: Resolve the successful standard CI run for this candidate
        env:
          CANDIDATE_COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api \
            "repos/$REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=100" \
            > standard-ci-runs.json
          ci_run_id="$(jq -r --arg commit "$CANDIDATE_COMMIT" \
            '[.workflow_runs[] | select(.event == "push" and .head_branch == "main" and .head_sha == $commit)] | sort_by(.id) | last | .id // empty' \
            standard-ci-runs.json)"
          if [ -z "$ci_run_id" ]; then
            echo "::error::No standard CI push run exists for candidate commit $CANDIDATE_COMMIT."
            exit 1
          fi
          gh api "repos/$REPOSITORY/actions/runs/$ci_run_id/jobs?per_page=100" \
            > standard-ci-jobs.json
          node trusted-tool/scripts/release-ci.mjs verify \
            --commit "$CANDIDATE_COMMIT" \
            --workflow-runs standard-ci-runs.json \
            --jobs standard-ci-jobs.json \
            --output standard-ci-evidence.json

      - name: Upload exact standard CI evidence
        uses: actions/upload-artifact@v7
        with:
          name: candidate-standard-ci-${{ github.run_id }}
          path: standard-ci-evidence.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  resolve-release-baseline:
    name: Resolve and pin Release Baseline
    needs: [validate-candidate-inputs, validate-release-configuration]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout immutable baseline resolver
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: trusted-tool
          persist-credentials: false
          repository: ${{ needs.validate-candidate-inputs.outputs.trusted-workflow-repository }}
          ref: ${{ needs.validate-candidate-inputs.outputs.trusted-workflow-sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: trusted-tool/package.json

      - name: Resolve and fully verify published baseline inputs
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY: ${{ vars.ENOKI_PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY_PEM }}
          TRUST_EPOCH_MIGRATION_AUTHORIZATION: ${{ vars.ENOKI_TRUST_EPOCH_MIGRATION_AUTHORIZATION_JSON }}
          TRUST_EPOCH_MIGRATION_SIGNATURE: ${{ vars.ENOKI_TRUST_EPOCH_MIGRATION_AUTHORIZATION_SIGNATURE_BASE64 }}
        run: >-
          node trusted-tool/scripts/release-baseline.mjs resolve
          --candidate-version "$CANDIDATE_VERSION"
          --github-repository YKDZ/enoki
          --github-token-env GH_TOKEN
          --hub-image ghcr.io/ykdz/enoki-hub
          --trusted-root-public-key-env PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY
          --trust-epoch-migration-authorization-env TRUST_EPOCH_MIGRATION_AUTHORIZATION
          --trust-epoch-migration-signature-env TRUST_EPOCH_MIGRATION_SIGNATURE
          --output release-baseline

      - name: Upload one pinned baseline resolution
        uses: actions/upload-artifact@v7
        with:
          name: candidate-release-baseline-${{ github.run_id }}
          path: release-baseline
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  build-probe:
    name: Build all Probe targets
    needs:
      [
        validate-candidate-inputs,
        validate-release-configuration,
        resolve-release-baseline,
      ]
    uses: ./.github/workflows/reusable-build-probe.yml
    with:
      commit: ${{ inputs.commit }}
      package-artifacts: true
      verify-reproducible: true
      version: ${{ inputs.version }}

  build-probe-bootstrap:
    name: Build independent Probe Bootstrap artifacts
    needs: [validate-candidate-inputs, validate-release-configuration]
    uses: ./.github/workflows/reusable-build-probe-bootstrap.yml
    with:
      commit: ${{ inputs.commit }}
      distribution: enoki
      version: ${{ inputs.version }}

  prepare-unsigned-probe-assets:
    name: Validate and prepare unsigned Probe Asset Set
    needs: [validate-candidate-inputs, build-probe]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate data without signing credentials
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: candidate-source
          persist-credentials: false
          ref: ${{ inputs.commit }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: candidate-source/package.json

      # The four exact names are a release-boundary allowlist. The regression
      # contract derives this list from the ordinary Probe producer matrix.
      - name: Download x86_64 musl Probe target build
        uses: actions/download-artifact@v8
        with:
          name: enoki-probe-x86_64-unknown-linux-musl-${{ github.run_id }}
          path: probe-builds

      - name: Download aarch64 musl Probe target build
        uses: actions/download-artifact@v8
        with:
          name: enoki-probe-aarch64-unknown-linux-musl-${{ github.run_id }}
          path: probe-builds

      - name: Download x86_64 glibc Probe target build
        uses: actions/download-artifact@v8
        with:
          name: enoki-probe-x86_64-unknown-linux-gnu-${{ github.run_id }}
          path: probe-builds

      - name: Download aarch64 glibc Probe target build
        uses: actions/download-artifact@v8
        with:
          name: enoki-probe-aarch64-unknown-linux-gnu-${{ github.run_id }}
          path: probe-builds

      - name: Deep-validate and prepare unsigned Probe Asset Set
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
          ENOKI_PROBE_ASSET_SIGNING_PUBLIC_KEY_PEM: ${{ vars.ENOKI_PROBE_ASSET_SIGNING_PUBLIC_KEY_PEM }}
          ENOKI_PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY_PEM: ${{ vars.ENOKI_PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY_PEM }}
          ENOKI_PROBE_TRUST_DELEGATION_JSON: ${{ vars.ENOKI_PROBE_TRUST_DELEGATION_JSON }}
          ENOKI_PROBE_TRUST_DELEGATION_SIGNATURE_BASE64: ${{ vars.ENOKI_PROBE_TRUST_DELEGATION_SIGNATURE_BASE64 }}
        run: |
          printf '%s' "$ENOKI_PROBE_TRUST_DELEGATION_JSON" > trust-delegation.json
          printf '%s' "$ENOKI_PROBE_TRUST_DELEGATION_SIGNATURE_BASE64" | base64 --decode > trust-delegation.json.sig
          node candidate-source/scripts/release-candidate.mjs prepare-unsigned-probe-assets \
            --version "$CANDIDATE_VERSION" --archives-dir probe-builds \
            --output unsigned-probe-assets \
            --public-key-env ENOKI_PROBE_ASSET_SIGNING_PUBLIC_KEY_PEM \
            --root-public-key-env ENOKI_PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY_PEM \
            --distribution enoki --trust-delegation trust-delegation.json \
            --trust-delegation-signature trust-delegation.json.sig

      - name: Upload exact unsigned signing input
        uses: actions/upload-artifact@v7
        with:
          name: candidate-unsigned-probe-assets-${{ github.run_id }}
          path: unsigned-probe-assets
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  sign-probe-assets:
    name: Sign complete Probe Asset Set at the trusted boundary
    needs: [validate-candidate-inputs, prepare-unsigned-probe-assets]
    runs-on: ubuntu-24.04
    steps:
      # Candidate source is data; no candidate-controlled script runs here.
      - name: Checkout protected trusted signer
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: trusted-signer
          persist-credentials: false
          repository: ${{ needs.validate-candidate-inputs.outputs.trusted-workflow-repository }}
          ref: ${{ needs.validate-candidate-inputs.outputs.trusted-workflow-sha }}

      - name: Verify immutable trusted signer revision
        working-directory: trusted-signer
        env:
          TRUSTED_SIGNER_COMMIT: ${{ needs.validate-candidate-inputs.outputs.trusted-workflow-sha }}
        run: test "$(git rev-parse HEAD)" = "$TRUSTED_SIGNER_COMMIT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: trusted-signer/package.json

      - name: Download exact unsigned signing input
        uses: actions/download-artifact@v8
        with:
          name: candidate-unsigned-probe-assets-${{ github.run_id }}
          path: unsigned-probe-assets

      - name: Sign only allowlisted, deeply validated content
        env:
          ENOKI_PROBE_ASSET_SIGNING_KEY_PEM: ${{ secrets.probe_asset_signing_key_pem }}
          ENOKI_PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY_PEM: ${{ vars.ENOKI_PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY_PEM }}
          ENOKI_PROBE_TRUST_DELEGATION_JSON: ${{ vars.ENOKI_PROBE_TRUST_DELEGATION_JSON }}
          ENOKI_PROBE_TRUST_DELEGATION_SIGNATURE_BASE64: ${{ vars.ENOKI_PROBE_TRUST_DELEGATION_SIGNATURE_BASE64 }}
        run: |
          printf '%s' "$ENOKI_PROBE_TRUST_DELEGATION_JSON" > trust-delegation.json
          printf '%s' "$ENOKI_PROBE_TRUST_DELEGATION_SIGNATURE_BASE64" | base64 --decode > trust-delegation.json.sig
          node trusted-signer/scripts/release-candidate.mjs sign-probe-assets \
            --input unsigned-probe-assets --output probe-assets \
            --private-key-env ENOKI_PROBE_ASSET_SIGNING_KEY_PEM \
            --root-public-key-env ENOKI_PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY_PEM \
            --trust-delegation trust-delegation.json \
            --trust-delegation-signature trust-delegation.json.sig

      - name: Validate exact signed output without signing credentials
        env:
          ENOKI_PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY_PEM: ${{ vars.ENOKI_PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY_PEM }}
        run: >-
          node trusted-signer/scripts/release-candidate.mjs
          validate-probe-assets probe-assets
          --root-public-key-env ENOKI_PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY_PEM

      - name: Upload signed Probe Asset Set
        uses: actions/upload-artifact@v7
        with:
          name: candidate-probe-assets-${{ github.run_id }}
          path: probe-assets
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  build-hub-oci:
    name: Build content-addressed Hub OCI archive
    needs: [validate-candidate-inputs, sign-probe-assets]
    uses: ./.github/workflows/reusable-hub-image.yml
    with:
      commit: ${{ inputs.commit }}
      package-artifact: true
      probe-assets-artifact-name: candidate-probe-assets-${{ github.run_id }}
      verify-reproducible: true
      version: ${{ inputs.version }}

  assemble-candidate:
    name: Assemble immutable Enoki Release Candidate
    needs:
      [
        validate-candidate-inputs,
        validate-release-configuration,
        resolve-release-baseline,
        sign-probe-assets,
        build-probe-bootstrap,
        build-hub-oci,
      ]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      artifact-name: ${{ steps.identity.outputs.artifact-name }}
    steps:
      - name: Checkout exact candidate source for provenance binding
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: candidate-source
          persist-credentials: false
          ref: ${{ inputs.commit }}

      - name: Checkout immutable trusted assembly tooling
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: trusted-tool
          persist-credentials: false
          repository: ${{ needs.validate-candidate-inputs.outputs.trusted-workflow-repository }}
          ref: ${{ needs.validate-candidate-inputs.outputs.trusted-workflow-sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: trusted-tool/package.json

      - name: Download signed Probe Asset Set
        uses: actions/download-artifact@v8
        with:
          name: candidate-probe-assets-${{ github.run_id }}
          path: candidate-inputs/probe-assets

      # Keep the independent Bootstrap allowlist separate from the ordinary
      # Probe target allowlist above.
      - name: Download x86_64 musl Probe Bootstrap artifact
        uses: actions/download-artifact@v8
        with:
          name: enoki-probe-bootstrap-x86_64-unknown-linux-musl-${{ github.run_id }}
          path: candidate-inputs/probe-bootstrap-inputs

      - name: Download aarch64 musl Probe Bootstrap artifact
        uses: actions/download-artifact@v8
        with:
          name: enoki-probe-bootstrap-aarch64-unknown-linux-musl-${{ github.run_id }}
          path: candidate-inputs/probe-bootstrap-inputs

      - name: Download x86_64 glibc Probe Bootstrap artifact
        uses: actions/download-artifact@v8
        with:
          name: enoki-probe-bootstrap-x86_64-unknown-linux-gnu-${{ github.run_id }}
          path: candidate-inputs/probe-bootstrap-inputs

      - name: Download aarch64 glibc Probe Bootstrap artifact
        uses: actions/download-artifact@v8
        with:
          name: enoki-probe-bootstrap-aarch64-unknown-linux-gnu-${{ github.run_id }}
          path: candidate-inputs/probe-bootstrap-inputs

      - name: Download Hub OCI archive
        uses: actions/download-artifact@v8
        with:
          name: candidate-hub-oci-${{ github.run_id }}
          path: candidate-inputs/hub

      - name: Download pinned Release Baseline
        uses: actions/download-artifact@v8
        with:
          name: candidate-release-baseline-${{ github.run_id }}
          path: candidate-inputs/release-baseline

      - name: Final recheck of pinned Release Baseline provenance
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY: ${{ vars.ENOKI_PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY_PEM }}
        run: >-
          node trusted-tool/scripts/release-baseline.mjs recheck
          --candidate-version "$CANDIDATE_VERSION"
          --github-repository YKDZ/enoki
          --github-token-env GH_TOKEN
          --trusted-root-public-key-env PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY
          --bundle candidate-inputs/release-baseline

      - name: Assemble and validate candidate
        env:
          CANDIDATE_COMMIT: ${{ inputs.commit }}
          CANDIDATE_VERSION: ${{ inputs.version }}
          ENOKI_PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY_PEM: ${{ vars.ENOKI_PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY_PEM }}
        run: |
          hub_archive="$(find candidate-inputs/hub -maxdepth 1 -type f -name '*.oci.tar' -print -quit)"
          if [ -z "$hub_archive" ]; then
            echo "::error::Hub OCI archive is missing."
            exit 1
          fi
          node trusted-tool/scripts/release-candidate.mjs assemble \
            --commit "$CANDIDATE_COMMIT" \
            --source-dir candidate-source \
            --version "$CANDIDATE_VERSION" \
            --bootstrap-artifacts candidate-inputs/probe-bootstrap-inputs \
            --probe-assets candidate-inputs/probe-assets \
            --hub-oci "$hub_archive" \
            --release-baseline candidate-inputs/release-baseline \
            --root-public-key-env ENOKI_PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY_PEM \
            --output candidate
          node trusted-tool/scripts/release-candidate.mjs validate candidate \
            --root-public-key-env ENOKI_PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY_PEM

      - name: Create deterministic candidate transfer archive
        env:
          ENOKI_PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY_PEM: ${{ vars.ENOKI_PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY_PEM }}
        run: >-
          node trusted-tool/scripts/release-candidate.mjs package-candidate
          --candidate candidate
          --output candidate.tar.gz
          --source-date-epoch 0
          --root-public-key-env ENOKI_PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY_PEM

      - name: Attest immutable candidate provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: candidate.tar.gz

      - name: Resolve private artifact identity
        id: identity
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: echo "artifact-name=enoki-release-candidate-${CANDIDATE_VERSION}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Upload immutable Enoki Release Candidate
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.identity.outputs.artifact-name }}
          path: candidate.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  prepare-release-e2e-matrix:
    name: Validate and expand Release Test Host matrix
    needs: [validate-candidate-inputs, assemble-candidate]
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.release-e2e-matrix.outputs.matrix }}
    steps:
      - name: Checkout immutable Release E2E tooling
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: trusted-tool
          persist-credentials: false
          repository: ${{ needs.validate-candidate-inputs.outputs.trusted-workflow-repository }}
          ref: ${{ needs.validate-candidate-inputs.outputs.trusted-workflow-sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: trusted-tool/package.json

      - name: Emit the validated Release E2E matrix
        id: release-e2e-matrix
        run: >-
          node trusted-tool/scripts/release-e2e-matrix.mjs github-actions
          --matrix trusted-tool/scripts/release-e2e-matrix.json
          > release-e2e-matrix.json
          && echo "matrix=$(jq -c . release-e2e-matrix.json)" >> "$GITHUB_OUTPUT"

  candidate-release-e2e:
    name: Release E2E (${{ matrix.cellId }})
    needs:
      [
        validate-candidate-inputs,
        assemble-candidate,
        prepare-release-e2e-matrix,
      ]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-release-e2e-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout immutable Release E2E tooling
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: trusted-tool
          persist-credentials: false
          repository: ${{ needs.validate-candidate-inputs.outputs.trusted-workflow-repository }}
          ref: ${{ needs.validate-candidate-inputs.outputs.trusted-workflow-sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: trusted-tool/package.json

      - name: Set up the shared Release runtime
        uses: ./trusted-tool/.github/actions/setup-release-runtime

      - name: Normalize the ephemeral Probe install prefix
        run: sudo install -d -o root -g root -m 0755 /usr/local/bin

      - name: Download the immutable candidate
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.assemble-candidate.outputs.artifact-name }}
          path: candidate-transfer

      - name: Extract the immutable candidate
        run: |
          mkdir candidate
          tar --extract --gzip --file candidate-transfer/candidate.tar.gz --directory candidate

      - name: Create ephemeral Owner credentials
        run: |
          owner_password="$(openssl rand -hex 32)"
          echo "::add-mask::$owner_password"
          echo "ENOKI_E2E_OWNER_PASSWORD=$owner_password" >> "$GITHUB_ENV"

      - name: Run the shared matrix scenario
        id: scenario
        env:
          HOST_ADAPTER: ${{ matrix.hostAdapter }}
          MATRIX_CELL: ${{ matrix.cellId }}
          ENOKI_PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY_PEM: ${{ vars.ENOKI_PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY_PEM }}
          RELEASE_E2E_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.cellId }}
        run: >-
          node trusted-tool/scripts/release-e2e.mjs run
          --candidate-manifest candidate/candidate-manifest.json
          --matrix trusted-tool/scripts/release-e2e-matrix.json
          --matrix-cell "$MATRIX_CELL"
          --host-adapter "$HOST_ADAPTER"
          --hub-owner-url http://127.0.0.1:33000
          --hub-public-url http://127.0.0.1:33000
          --owner-password-env ENOKI_E2E_OWNER_PASSWORD
          --root-public-key-env ENOKI_PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY_PEM
          --evidence-dir "release-e2e-evidence/$MATRIX_CELL"
          --run-id "$RELEASE_E2E_RUN_ID"

      - name: Independently verify the Release Test Host is clean
        id: verify-clean
        if: ${{ always() }}
        env:
          HOST_ADAPTER: ${{ matrix.hostAdapter }}
          MATRIX_CELL: ${{ matrix.cellId }}
        run: >-
          node trusted-tool/scripts/release-e2e.mjs verify-clean
          --run-manifest "release-e2e-evidence/$MATRIX_CELL/run-manifest.json"
          --host-adapter "$HOST_ADAPTER"

      - name: Record this complete fresh-VM gate outcome
        if: ${{ always() }}
        env:
          ARTIFACT_NAME: release-e2e-${{ matrix.cellId }}-${{ github.run_id }}
          MATRIX_CELL: ${{ matrix.cellId }}
          SCENARIO_OUTCOME: ${{ steps.scenario.outcome }}
          VERIFY_CLEAN_OUTCOME: ${{ steps.verify-clean.outcome }}
        run: >-
          node trusted-tool/scripts/release-verification.mjs record-matrix-gate
          --candidate-manifest candidate/candidate-manifest.json
          --evidence "release-e2e-evidence/$MATRIX_CELL/evidence.json"
          --cell-id "$MATRIX_CELL"
          --scenario-outcome "$SCENARIO_OUTCOME"
          --verify-clean-outcome "$VERIFY_CLEAN_OUTCOME"
          --artifact-name "$ARTIFACT_NAME"
          --output "release-e2e-evidence/$MATRIX_CELL/gate-result.json"

      - name: Upload run manifest and lifecycle evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-e2e-${{ matrix.cellId }}-${{ github.run_id }}
          path: |
            release-e2e-evidence/${{ matrix.cellId }}/run-manifest.json
            release-e2e-evidence/${{ matrix.cellId }}/evidence.json
            release-e2e-evidence/${{ matrix.cellId }}/gate-result.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  candidate-ui-contract:
    name: Candidate-image UI Contract
    needs: [validate-candidate-inputs, assemble-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Initialize bounded UI Contract evidence
        id: initialize-evidence
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p release-ui-contract-evidence
          jq --null-input \
            --arg commit "$REQUESTED_COMMIT" \
            --arg version "$REQUESTED_VERSION" \
            '{kind: "enoki-release-ui-contract-workflow-setup", requested: {commit: $commit, version: $version}, schemaVersion: 1, steps: {}}' \
            > release-ui-contract-evidence/workflow-setup.json

      - name: Checkout immutable UI Contract tooling
        id: checkout-tooling
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: trusted-tool
          persist-credentials: false
          repository: ${{ needs.validate-candidate-inputs.outputs.trusted-workflow-repository }}
          ref: ${{ needs.validate-candidate-inputs.outputs.trusted-workflow-sha }}

      - name: Enable Corepack
        id: enable-corepack
        run: corepack enable

      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version-file: trusted-tool/package.json
          cache: pnpm
          cache-dependency-path: trusted-tool/pnpm-lock.yaml

      - name: Set up the shared Release runtime
        uses: ./trusted-tool/.github/actions/setup-release-runtime

      - name: Install UI Contract dependencies
        id: install-dependencies
        working-directory: trusted-tool
        run: pnpm install --frozen-lockfile

      - name: Install the candidate gate browser
        id: install-browser
        working-directory: trusted-tool
        run: pnpm exec playwright install --with-deps chromium

      - name: Download the immutable candidate
        id: download-candidate
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.assemble-candidate.outputs.artifact-name }}
          path: candidate-transfer

      - name: Extract the immutable candidate
        id: extract-candidate
        run: |
          mkdir candidate
          tar --extract --gzip --file candidate-transfer/candidate.tar.gz --directory candidate

      - name: Run the candidate-image Playwright UI Contract once
        id: candidate-playwright
        working-directory: trusted-tool
        env:
          CANDIDATE_MANIFEST: ${{ github.workspace }}/candidate/candidate-manifest.json
          EVIDENCE_DIR: ${{ github.workspace }}/release-ui-contract-evidence
          ENOKI_PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY_PEM: ${{ vars.ENOKI_PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY_PEM }}
        run: >-
          pnpm run test:e2e:candidate
          --candidate-manifest "$CANDIDATE_MANIFEST"
          --evidence-dir "$EVIDENCE_DIR"
          --root-public-key-env ENOKI_PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY_PEM

      - name: Record every UI Contract setup and runtime outcome
        if: ${{ always() }}
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout-tooling.outcome }}
          COREPACK_OUTCOME: ${{ steps.enable-corepack.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.install-dependencies.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download-candidate.outcome }}
          EXTRACT_OUTCOME: ${{ steps.extract-candidate.outcome }}
          NODE_OUTCOME: ${{ steps.setup-node.outcome }}
          PLAYWRIGHT_OUTCOME: ${{ steps.candidate-playwright.outcome }}
          BROWSER_OUTCOME: ${{ steps.install-browser.outcome }}
          REQUESTED_COMMIT: ${{ inputs.commit }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p release-ui-contract-evidence
          jq --null-input \
            --arg browser "$BROWSER_OUTCOME" \
            --arg checkout "$CHECKOUT_OUTCOME" \
            --arg commit "$REQUESTED_COMMIT" \
            --arg corepack "$COREPACK_OUTCOME" \
            --arg dependencies "$DEPENDENCIES_OUTCOME" \
            --arg download "$DOWNLOAD_OUTCOME" \
            --arg extract "$EXTRACT_OUTCOME" \
            --arg node "$NODE_OUTCOME" \
            --arg playwright "$PLAYWRIGHT_OUTCOME" \
            --arg version "$REQUESTED_VERSION" \
            '{kind: "enoki-release-ui-contract-workflow-setup", requested: {commit: $commit, version: $version}, schemaVersion: 1, steps: {browser: $browser, checkout: $checkout, corepack: $corepack, dependencies: $dependencies, candidateDownload: $download, candidateExtract: $extract, node: $node, playwright: $playwright}}' \
            > release-ui-contract-evidence/workflow-setup.json

      - name: Record the candidate-image UI Contract outcome
        if: ${{ always() }}
        env:
          ARTIFACT_NAME: release-ui-contract-${{ github.run_id }}
          CANDIDATE_COMMIT: ${{ inputs.commit }}
          CANDIDATE_MANIFEST: ${{ github.workspace }}/candidate/candidate-manifest.json
          CANDIDATE_VERSION: ${{ inputs.version }}
          PLAYWRIGHT_OUTCOME: ${{ steps.candidate-playwright.outcome }}
        run: |
          mkdir -p release-ui-contract-evidence
          if test -f trusted-tool/scripts/release-verification.mjs && \
            node trusted-tool/scripts/release-verification.mjs record-ui-gate \
              --candidate-manifest "$CANDIDATE_MANIFEST" \
              --candidate-commit "$CANDIDATE_COMMIT" \
              --candidate-version "$CANDIDATE_VERSION" \
              --playwright-outcome "$PLAYWRIGHT_OUTCOME" \
              --artifact-name "$ARTIFACT_NAME" \
              --output release-ui-contract-evidence/gate-result.json; then
            exit 0
          fi
          jq --null-input \
            --arg artifactName "$ARTIFACT_NAME" \
            --arg commit "$CANDIDATE_COMMIT" \
            --arg playwrightStepOutcome "$PLAYWRIGHT_OUTCOME" \
            --arg version "$CANDIDATE_VERSION" \
            '{artifactName: $artifactName, candidate: {commit: $commit, version: $version}, kind: "enoki-release-ui-contract-gate", outcome: "failed", playwrightStepOutcome: $playwrightStepOutcome, schemaVersion: 1}' \
            > release-ui-contract-evidence/gate-result.json

      - name: Upload candidate-image UI Contract evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-ui-contract-${{ github.run_id }}
          path: |
            release-ui-contract-evidence/gate-result.json
            release-ui-contract-evidence/runner-evidence.json
            release-ui-contract-evidence/workflow-setup.json
            release-ui-contract-evidence/playwright-report
            release-ui-contract-evidence/test-results
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  finalize-verification:
    name: Finalize fail-closed candidate evidence
    if: ${{ always() }}
    needs:
      [
        validate-candidate-inputs,
        validate-release-configuration,
        resolve-release-baseline,
        build-probe,
        prepare-unsigned-probe-assets,
        sign-probe-assets,
        build-hub-oci,
        assemble-candidate,
        prepare-release-e2e-matrix,
        candidate-release-e2e,
        candidate-ui-contract,
      ]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      artifact-name: ${{ steps.summary-identity.outputs.artifact-name }}
    steps:
      - name: Checkout immutable verification finalizer
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: trusted-tool
          persist-credentials: false
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: trusted-tool/package.json

      - name: Download the one assembled candidate
        id: download-candidate
        if: ${{ always() && needs.assemble-candidate.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.assemble-candidate.outputs.artifact-name }}
          path: candidate-transfer

      - name: Extract the one assembled candidate
        if: ${{ always() && steps.download-candidate.outcome == 'success' }}
        run: |
          mkdir candidate
          tar --extract --gzip --file candidate-transfer/candidate.tar.gz --directory candidate

      - name: Download the available Release Baseline identity
        if: ${{ always() && needs.resolve-release-baseline.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: candidate-release-baseline-${{ github.run_id }}
          path: attempt-inputs/release-baseline

      - name: Download the exact standard CI evidence
        if: ${{ always() && needs.validate-release-configuration.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: candidate-standard-ci-${{ github.run_id }}
          path: attempt-inputs/standard-ci

      - name: Download the available signed Probe Asset Set identity
        if: ${{ always() && needs.sign-probe-assets.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: candidate-probe-assets-${{ github.run_id }}
          path: attempt-inputs/probe-assets

      - name: Download the available Hub OCI identity
        if: ${{ always() && needs.build-hub-oci.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: candidate-hub-oci-${{ github.run_id }}
          path: attempt-inputs/hub

      - name: Download every Host evidence bundle
        if: ${{ always() && needs.candidate-release-e2e.result != 'skipped' }}
        uses: actions/download-artifact@v8
        with:
          pattern: release-e2e-*-${{ github.run_id }}
          path: release-e2e-gates

      - name: Download candidate-image UI Contract evidence
        if: ${{ always() && needs.candidate-ui-contract.result != 'skipped' }}
        uses: actions/download-artifact@v8
        with:
          name: release-ui-contract-${{ github.run_id }}
          path: release-ui-contract-gate

      - name: Record every component outcome for this workflow attempt
        if: ${{ always() }}
        env:
          ASSEMBLY_RESULT: ${{ needs.assemble-candidate.result }}
          BASELINE_RESULT: ${{ needs.resolve-release-baseline.result }}
          HUB_OCI_RESULT: ${{ needs.build-hub-oci.result }}
          HOST_MATRIX_RESULT: ${{ needs.candidate-release-e2e.result }}
          INPUT_RESULT: ${{ needs.validate-candidate-inputs.result }}
          MATRIX_EXPANSION_RESULT: ${{ needs.prepare-release-e2e-matrix.result }}
          PROBE_BUILD_RESULT: ${{ needs.build-probe.result }}
          PROBE_PREPARATION_RESULT: ${{ needs.prepare-unsigned-probe-assets.result }}
          PROBE_SIGNING_RESULT: ${{ needs.sign-probe-assets.result }}
          STANDARD_CI_RESULT: ${{ needs.validate-release-configuration.result }}
          UI_RESULT: ${{ needs.candidate-ui-contract.result }}
        run: |
          jq --null-input \
            --arg candidateAssembly "$ASSEMBLY_RESULT" \
            --arg candidateUiContract "$UI_RESULT" \
            --arg hubOciBuild "$HUB_OCI_RESULT" \
            --arg hostMatrix "$HOST_MATRIX_RESULT" \
            --arg inputValidation "$INPUT_RESULT" \
            --arg matrixExpansion "$MATRIX_EXPANSION_RESULT" \
            --arg probeBuild "$PROBE_BUILD_RESULT" \
            --arg probePreparation "$PROBE_PREPARATION_RESULT" \
            --arg probeSigning "$PROBE_SIGNING_RESULT" \
            --arg releaseBaseline "$BASELINE_RESULT" \
            --arg standardCi "$STANDARD_CI_RESULT" \
            '{candidateAssembly: $candidateAssembly, candidateUiContract: $candidateUiContract, hubOciBuild: $hubOciBuild, hostMatrix: $hostMatrix, inputValidation: $inputValidation, matrixExpansion: $matrixExpansion, probeBuild: $probeBuild, probePreparation: $probePreparation, probeSigning: $probeSigning, releaseBaseline: $releaseBaseline, standardCi: $standardCi}' \
            > component-results.json

      - name: Resolve direct links to this attempt's private evidence artifacts
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ARTIFACT_BASE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api --method GET \
            "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            -f per_page=100 \
            > workflow-artifacts.json
          jq --arg base "$RUN_ARTIFACT_BASE" \
            '[.artifacts[] | select(.expired == false) | {key: .name, value: ($base + "/" + (.id | tostring))}] | from_entries' \
            workflow-artifacts.json > artifact-index.json

      - name: Generate the authoritative candidate verification summary
        if: ${{ always() }}
        env:
          ENOKI_PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY_PEM: ${{ vars.ENOKI_PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY_PEM }}
          REQUESTED_COMMIT: ${{ inputs.commit }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: >-
          node trusted-tool/scripts/release-verification.mjs summarize
          --candidate-dir candidate
          --root-public-key-env ENOKI_PROBE_DISTRIBUTION_ROOT_PUBLIC_KEY_PEM
          --release-baseline-dir attempt-inputs/release-baseline
          --probe-assets-dir attempt-inputs/probe-assets
          --hub-oci-dir attempt-inputs/hub
          --matrix trusted-tool/scripts/release-e2e-matrix.json
          --matrix-evidence-root release-e2e-gates
          --ui-gate release-ui-contract-gate/gate-result.json
          --artifact-index artifact-index.json
          --component-results component-results.json
          --standard-ci attempt-inputs/standard-ci/standard-ci-evidence.json
          --requested-commit "$REQUESTED_COMMIT"
          --requested-version "$REQUESTED_VERSION"
          --run-id "$RUN_ID"
          --run-attempt "$RUN_ATTEMPT"
          --run-url "$RUN_URL"
          --output release-verification-summary.json
          --markdown release-verification-summary.md

      - name: Publish the summary to the workflow run
        if: ${{ always() && hashFiles('release-verification-summary.md') != '' }}
        run: cat release-verification-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve verification evidence identity
        id: summary-identity
        if: ${{ always() }}
        run: echo "artifact-name=release-verification-summary-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Upload the authoritative verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.summary-identity.outputs.artifact-name }}
          path: |
            release-verification-summary.json
            release-verification-summary.md
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Require every verification gate to have succeeded
        if: ${{ always() }}
        run: >-
          node trusted-tool/scripts/release-verification.mjs assert-verified
          --summary release-verification-summary.json
