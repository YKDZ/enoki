name: Reusable CI Hub Image

on:
  workflow_call:
    inputs:
      version:
        description: Local CI image label, for example ci.
        required: true
        type: string

jobs:
  hub-image:
    name: Hub Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build Hub image
        run: DOCKER_BUILDKIT=1 docker build -f apps/hub/Dockerfile -t "enoki-hub:${{ inputs.version }}" .
