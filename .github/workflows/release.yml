name: Release Enoki Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable candidate SemVer tag, for example v0.1.0.
        required: true
        type: string
      mode:
        description: Verify a fresh candidate, then optionally publish those exact bytes.
        required: true
        type: choice
        default: verify-only
        options:
          - verify-only
          - publish

permissions:
  contents: read

concurrency:
  group: enoki-release-global
  cancel-in-progress: false

jobs:
  validate-release-request:
    name: Validate explicit release request
    runs-on: ubuntu-24.04
    steps:
      - name: Reject ambiguous or untrusted release requests
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          if [ "$GITHUB_REPOSITORY" != "YKDZ/enoki" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Release verification must run from the canonical protected main branch."
            exit 1
          fi
          if [ "$RELEASE_MODE" != "verify-only" ] && [ "$RELEASE_MODE" != "publish" ]; then
            echo "::error::Mode must be verify-only or publish."
            exit 1
          fi
          if ! printf '%s' "$CANDIDATE_VERSION" | grep -Eq '^v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$'; then
            echo "::error::Candidate version must be a strict stable SemVer tag like v0.1.0."
            exit 1
          fi

  verify-candidate:
    name: Build and completely verify a fresh candidate
    needs: validate-release-request
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-build-release-candidate.yml
    secrets:
      probe_asset_signing_key_pem: ${{ secrets.ENOKI_PROBE_ASSET_SIGNING_KEY_PEM }}
    with:
      commit: ${{ github.sha }}
      version: ${{ inputs.version }}

  publish-candidate:
    name: Publish the verified candidate idempotently
    if: ${{ inputs.mode == 'publish' }}
    needs: [validate-release-request, verify-candidate]
    permissions:
      actions: read
      contents: write
      packages: write
    uses: ./.github/workflows/reusable-publish-release-candidate.yml
    with:
      candidate-artifact-name: ${{ needs.verify-candidate.outputs.candidate-artifact-name }}
      commit: ${{ github.sha }}
      verification-artifact-name: ${{ needs.verify-candidate.outputs.verification-artifact-name }}
      version: ${{ inputs.version }}
