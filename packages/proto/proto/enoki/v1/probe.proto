syntax = "proto3";

package enoki.v1;

import "enoki/v1/configuration.proto";
import "enoki/v1/collectors/host_profile.proto";
import "enoki/v1/collectors/system_state.proto";
import "enoki/v1/metrics.proto";
import "enoki/v1/operations.proto";

message ProbeRegistrationRequest {
  string enrollment_token = 1;
  string probe_public_key_pem = 3;
  repeated Snapshot snapshots = 4;
  // An installer may use the existing registration endpoint to safely
  // terminate its own nonterminal Enrollment before it has generated an
  // identity or mutated the local machine.
  ProbeInstallationRejection installation_rejection = 5;
  // A staged installer asks the authoritative Hub which lifecycle it may run
  // before generating an identity or mutating local installation resources.
  ProbeInstallationInspection installation_inspection = 6;
  // Replacement 注册携带由候选密钥签名的精确版本化注册尝试字节。
  // 旧式 Enrollment 仍使用外层字段。
  bytes canonical_attempt = 7;
  bytes candidate_signature = 8;
}

// 规范字节是这个封闭消息的 protobuf 编码。Hub 只有在解码后重新编码
// 仍与原字节逐字节一致时才接受。
message ProbeRegistrationAttempt {
  uint32 schema_version = 1;
  string enrollment_id = 2;
  string hub_origin = 3;
  string host_id = 4;
  string old_probe_id = 5;
  string source_probe_version = 6;
  string target_probe_version = 7;
  string target_asset_set_digest = 8;
  string target_manifest_sha256 = 9;
  string replacement_commit_sha256 = 10;
  string nonce = 11;
  string candidate_public_key_pem = 12;
  string committed_source_probe_sha256 = 13;
  string target_bundle_target = 14;
}

message ProbeInstallationInspection {}

enum ProbeEnrollmentTargetKind {
  PROBE_ENROLLMENT_TARGET_KIND_UNSPECIFIED = 0;
  NEW_HOST = 1;
  EXISTING_HOST = 2;
  MANUAL_REINSTALL = 3;
}

message ProbeInstallationInspectionResponse {
  ProbeEnrollmentTargetKind target_kind = 1;
  string expected_hub_origin = 2;
  string expected_probe_id = 3;
  string source_probe_version = 4;
  string target_probe_version = 5;
  string target_asset_set_digest = 6;
  repeated string source_probe_sha256 = 7;
  // 与等待中的 manual-reinstall Enrollment 绑定的公开 correlation facts。
  string enrollment_id = 8;
  string target_host_id = 9;
}

message ProbeInstallationRejection {
  string code = 1;
  string message = 2;
  // Public correlation context for same-Hub existing-installation recovery.
  // It is deliberately separate from the human-readable message.
  string existing_probe_id = 3;
}

message ProbeRegistrationResponse {
  string probe_id = 1;
  string probe_secret = 2;
  int64 server_time_ms = 3;
  ProbeConfigurationResponse initial_configuration = 4;
  // Correlates the immediately following Probe Startup Report with the
  // enrollment attempt that created this Probe Identity.  Older Hubs and
  // Probes omit it without changing the frame shape.
  string enrollment_id = 5;
  ProbeInstallationInspectionResponse installation_inspection = 6;
  // Hub 在 registration transaction 中持久绑定的 Host；本机身份 receipt
  // 必须保存它，不能从后续 Probe route 反向推断。
  string host_id = 7;
}

message ProbeReportRequest {
  string probe_id = 1;
  string boot_id = 2;
  uint64 sequence_start = 3;
  uint64 sequence_end = 4;
  string probe_configuration_version = 6;
  repeated MetricSample metrics = 7;
  ProbeConfigurationError probe_configuration_error = 9;
  repeated ProbeOperationAcknowledgement operation_acknowledgements = 10;
  repeated ProbeOperationStatus operation_statuses = 11;
  repeated Snapshot snapshots = 12;
  string enrollment_id = 13;
  ObservationWindowFailure observation_window_failure = 14;
  repeated CpuResourceCollectionOutcome cpu_resource_collection_outcomes = 15;
  // 出现在不含 Observation 的 sequence-one Boot Report。
  string probe_asset_bundle_version = 16;
}

// CPU Resource acquisition 的闭合结果；不携带实现名、路径或诊断文本。
message CpuResourceCollectionOutcome {
  uint64 sequence = 1;
  CpuResourceCollectionOutcomeReason reason = 2;
}

enum CpuResourceCollectionOutcomeReason {
  CPU_RESOURCE_COLLECTION_OUTCOME_REASON_UNSPECIFIED = 0;
  CPU_RESOURCE_UNAVAILABLE = 1;
  CPU_RESOURCE_MALFORMED = 2;
  CPU_PROVIDER_ACTIVATION_BUDGET_EXHAUSTED = 3;
}

// 闭合的 Runtime 报告级失败，不携带 Provider、Resource、路径或本机诊断。
message ObservationWindowFailure {
  ObservationWindowFailureReason reason = 1;
}

enum ObservationWindowFailureReason {
  OBSERVATION_WINDOW_FAILURE_REASON_UNSPECIFIED = 0;
  OBSERVATION_RUNTIME_UNAVAILABLE = 1;
  OBSERVATION_RUNTIME_INVALID_RESPONSE = 2;
  PROBE_ASSET_BUNDLE_INCOHERENT = 3;
}

message ProbeReportResponse {
  uint64 accepted_sequence_end = 1;
  int64 server_time_ms = 2;
  string current_probe_configuration_version = 3;
  ProbeOperation pending_operation = 5;
  repeated string requested_snapshot_collector_ids = 6;
}
