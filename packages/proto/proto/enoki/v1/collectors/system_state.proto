syntax = "proto3";

package enoki.v1;

import "enoki/v1/collectors/host_profile.proto";

// Provider 读取的一组不可变 CPU counter 事实。
message CpuCounterResourceFact {
  string name = 1;
  uint64 user = 2;
  uint64 nice = 3;
  uint64 system = 4;
  uint64 idle = 5;
  uint64 iowait = 6;
  uint64 irq = 7;
  uint64 softirq = 8;
  uint64 steal = 9;
}

// 一次固定 pull 的完整 typed Resource Result。
// procfs 文本仍是内部 Resource 事实；Collector 计算只在 Runtime 中进行。
message SystemStateResourceResult {
  repeated CpuCounterResourceFact cpu_counters = 1;
  string proc_loadavg = 2;
  string proc_meminfo = 3;
  string proc_uptime = 4;
  HostProfileResourceFacts host_profile = 5;
}
