packages:
  - apps/*
  - packages/*

nodeLinker: isolated

autoInstallPeers: false

injectWorkspacePackages: true

dedupeInjectedDeps: false

syncInjectedDepsAfterScripts:
  - build

minimumReleaseAge: 1440

minimumReleaseAgeStrict: true

overrides:
  "pinia>typescript": "-"
  "vue>typescript": "-"

allowBuilds:
  better-sqlite3: true
  esbuild: true
  protobufjs: true
  vue-demi: true

catalog:
  "@hono/node-server": ^2.1.0
  "@playwright/test": ^1.62.1
  "@tailwindcss/vite": ^4.3.3
  "@types/node": ^24.13.3
  "@vitejs/plugin-vue": ^6.0.7
  "@vue/server-renderer": 3.5.41
  "@vue/test-utils": ^2.4.6
  "@vue/tsconfig": ^0.9.1
  eslint-plugin-better-tailwindcss: ^4.7.0
  hono: ^4.13.1
  happy-dom: ^20.11.1
  oxfmt: ^0.62.0
  oxlint: ^1.77.0
  oxlint-tsgolint: ^7.0.2001
  pinia: ^4.0.2
  tailwindcss: ^4.3.3
  turbo: 2.10.8
  typescript: ^7.0.2
  valibot: ^1.4.2
  vite: ^8.2.1
  vitest: ^4.1.10
  vue: ^3.5.41
  vue-tsc: ^3.3.9
