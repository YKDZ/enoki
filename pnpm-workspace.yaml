packages:
  - apps/*
  - packages/*

nodeLinker: isolated

autoInstallPeers: false

injectWorkspacePackages: true

dedupeInjectedDeps: false

syncInjectedDepsAfterScripts:
  - build

minimumReleaseAge: 1440

minimumReleaseAgeStrict: true

overrides:
  "pinia>typescript": "-"
  "vue>typescript": "-"

allowBuilds:
  better-sqlite3: true
  esbuild: true
  protobufjs: true
  vue-demi: true

catalog:
  "@hono/node-server": ^2.1.5
  "@playwright/test": ^1.64.1
  "@tailwindcss/vite": ^4.3.3
  "@types/node": ^24.19.2
  "@vitejs/plugin-vue": ^6.0.10
  "@vue/server-renderer": 3.5.44
  "@vue/test-utils": ^2.5.1
  "@vue/tsconfig": ^0.9.1
  eslint-plugin-better-tailwindcss: ^4.9.1
  hono: ^4.13.13
  happy-dom: ^21.0.3
  oxfmt: ^0.73.0
  oxlint: ^1.88.0
  oxlint-tsgolint: ^7.0.2004
  pinia: ^4.1.0
  tailwindcss: ^4.3.2
  turbo: 2.11.8
  typescript: ^7.0.2
  valibot: ^1.5.0
  vite: ^8.3.4
  vitest: ^5.0.5
  vue: ^3.5.44
  vue-tsc: ^3.3.13
