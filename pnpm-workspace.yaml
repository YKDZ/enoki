packages:
  - apps/*
  - packages/*

nodeLinker: isolated

autoInstallPeers: false

injectWorkspacePackages: true

dedupeInjectedDeps: false

syncInjectedDepsAfterScripts:
  - build

minimumReleaseAge: 1440

minimumReleaseAgeStrict: true

overrides:
  "pinia>typescript": "-"
  "vue>typescript": "-"

allowBuilds:
  better-sqlite3: true
  esbuild: true
  protobufjs: true
  vue-demi: true

catalog:
  "@hono/node-server": ^2.1.1
  "@playwright/test": ^1.63.0
  "@tailwindcss/vite": ^4.3.3
  "@types/node": ^24.13.5
  "@vitejs/plugin-vue": ^6.0.9
  "@vue/server-renderer": 3.5.43
  "@vue/test-utils": ^2.5.1
  "@vue/tsconfig": ^0.9.1
  eslint-plugin-better-tailwindcss: ^4.7.0
  hono: ^4.13.8
  happy-dom: ^20.14.5
  oxfmt: ^0.68.0
  oxlint: ^1.83.0
  oxlint-tsgolint: ^7.0.2001
  pinia: ^4.0.3
  tailwindcss: ^4.3.2
  turbo: 2.10.13
  typescript: ^7.0.2
  valibot: ^1.5.0
  vite: ^8.3.0
  vitest: ^5.0.1
  vue: ^3.5.43
  vue-tsc: ^3.3.11
